<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <title>Form example</title>
    </head>
    <body>
      <!-- <h1>Elememts of the OSI model protocol layers</h1>
        <p>Some of the elements are:</p>
        <h2>Physical layer</h2>
        <p>This describes the physical and electrical proprties of the communication media</p>
        <h3>Data link layer</h3>
        <p>This describes the logical organization of data transmitted on a particular medium</p>
        <h4>Network layer</h4>
        <p>This layer enables data communication between devices on different networks</p>
        <h5>Transport layer</h5>
        <p>This describes the quality and nature of data delivery</p>
        <h6>Session layer</h6>
        <p>This describes the organisation of large data sequences</p>-->
        <form method="get" action="process.php">
            <label for="name">Title</label><br>
            <input type="text" id="name" name="name"/><br>
            <input type="password" name="password"/><br>
            <input type="search" placeholder="Enter search text" name="search"/><br>
            <input type="email" name="email"/><br>
            <input type="submit" value="submit"/><br>
        </form>
        <fieldset>
            <legend>Details</legend>
            <p>
                <label>Title</label>
                <input type="text" name="title"/>
            </p>
            <p>
                <label>Country</label>
                <select name="where">
                    <option value="">Choose a country</option>
                    <option value="CA">Canada</option>
                    <option value="FI">Finland</option>
                    <option value="US">United States</option>
                </select>
                </p>
                <p>
                    <label>Choices:</label><br>
                    <select name="City">
                        <option value="calgary">Calgary</option>
                        <option value="new york">New York</option>
                        <option value="helsinki">Helsinki</option>
                    </select>
                </p>
                <!--Choice control-->
                <select name="choices">
                    <option>First</option>
                    <option selected>Second</option>
                </select>
                </p>
                <p>
                    <label>I accept the software license</label>
                    <input type="checkbox" name="accept">
                </p>
                    <label>Where would you like to visit</label><br>
                    <input type="checkbox" name="visit" value="Canada">Canada<br>
                    <input type="checkbox" name="visit" value="France">France<br>
                    <input type="checkbox" name="visit" value="Germay">Germany<br>
                    <input type="checkbox" name="visit" value="United kingdom">United kingdom<br>
                    <!-- Image controls-->
                     <input type="submit"/>
                     <input type="reset"/>
                     <input type="button" value="Click Me"/>
                     <input type="image" src="travel.jpeg"alt="Travel"/>
                     <button>
                        <a href="email.html">
                            <img src="email.jpeg" alt="Email"/>
                        </a>
                     </button>
                     <button type="submit">
                        <img src="email.jpeg" alt="submit">
                     </button>
                     <form method="post" enctype="multipart/form-data">
                        <label>Upload a travel photo</label>
                        <input type="file" name="photo">
                     </form>
                     <label>Bg color</label><br>
                     <input type="color" name="Bgcolor"
            </p>
        </fieldset>
    </body>
</html>
